<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Doon View: what visitors say about Mussoorie's hotels, and how each property compares with its market." />
    <meta name="theme-color" content="#090d18" id="theme-color-meta" />
    <title>Doon View</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      (function () {
        // Midnight Ridge is dark by default; a stored choice from the toggle wins.
        var stored = null;
        try { stored = localStorage.getItem('theme'); } catch (e) {}
        if (stored !== 'light') document.documentElement.classList.add('dark');
        else document.getElementById('theme-color-meta').setAttribute('content', '#f1f3f6');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
